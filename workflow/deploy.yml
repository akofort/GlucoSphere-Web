name: Deploy

# Runs on the self-hosted runner registered on 192.168.1.110 itself, so this builds and restarts
# the Docker containers directly on the deploy target -- no SSH hop needed (unlike deploy.sh,
# which is for running from a developer machine outside the LAN-local runner).
on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build stamp
        id: stamp
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and start containers
        env:
          VITE_BUILD_SHA: ${{ steps.stamp.outputs.sha }}
          VITE_BUILD_TIME: ${{ steps.stamp.outputs.time }}
        run: docker compose up -d --build backend frontend

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8180/api/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after deploy" >&2
          exit 1
